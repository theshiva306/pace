name: Final mobile chat polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile chat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/GroupDetail.jsx')
          text = path.read_text()

          new_chat = r'''function Chat({ groupId, messages, user, profile }) {
            const [text, setText] = useState('')
            const [emojiOpen, setEmojiOpen] = useState(false)
            const inputRef = useRef(null)
            const listRef = useRef(null)
            const emojis = ['😀','😂','🤣','😊','😍','🥹','😎','🤝','👏','🔥','❤️','💯','🙌','👍','👎','😭','😅','🤔','😴','🎯','📚','⏱️','🚀','✨','💪','🫡','😤','😮','😢','🙏','👀','🧠','☕','🏆','🎉','💀','😂','❤️‍🔥','🥲','😆','😇','🤩','😏','😬','🤗','😮‍💨','🫶','💙','💚','💛','🤍','🖤']

            useEffect(() => {
              const el = listRef.current
              if (!el) return
              el.scrollTop = el.scrollHeight
            }, [messages.length])

            function insertEmoji(emoji) {
              const input = inputRef.current
              if (!input) {
                setText((v) => v + emoji)
                return
              }
              const start = input.selectionStart ?? text.length
              const end = input.selectionEnd ?? text.length
              const next = text.slice(0, start) + emoji + text.slice(end)
              setText(next)
              requestAnimationFrame(() => {
                input.focus({ preventScroll: true })
                const pos = start + emoji.length
                input.setSelectionRange(pos, pos)
              })
            }

            async function handleSubmit(e) {
              e.preventDefault()
              const value = text.trim()
              if (!value) return
              await sendMessage({ groupId, uid: user.uid, displayName: profile?.displayName || user.displayName || 'User', photoURL: profile?.photoURL || user.photoURL || null, text: value })
              setText('')
              requestAnimationFrame(() => inputRef.current?.focus({ preventScroll: true }))
            }

            const groups = []
            let current = null
            for (const message of messages || []) {
              const sameSender = current && current.uid === message.uid
              if (!sameSender) {
                current = { uid: message.uid, messages: [] }
                groups.push(current)
              }
              current.messages.push(message)
            }

            return <div className="flex-1 min-h-0 flex flex-col relative overflow-hidden">
              <div ref={listRef} className="flex-1 min-h-0 overflow-y-auto overscroll-contain no-scrollbar py-2 pr-0">
                <div className="flex flex-col gap-3 pb-3">
                  {groups.length === 0 && <div className="flex-1 flex items-center justify-center py-16 text-xs text-text-faint">No messages yet.</div>}
                  {groups.map((group, groupIndex) => {
                    const mine = group.uid === user.uid
                    const last = group.messages[group.messages.length - 1]
                    return <div key={`${group.uid}-${groupIndex}`} className={`flex items-end gap-2 ${mine ? 'justify-end' : 'justify-start'}`}>
                      {!mine && <div className="w-7 shrink-0 self-end"><Avatar name={last.displayName} photoURL={last.photoURL} size="xs" /></div>}
                      <div className={`max-w-[82%] flex flex-col gap-1 ${mine ? 'items-end' : 'items-start'}`}>
                        {group.messages.map((message) => <div key={message.id || message.timestamp || `${message.uid}-${message.text}`} className={`rounded-2xl px-3.5 py-2 text-sm leading-5 break-words ${mine ? 'bg-accent text-bg rounded-br-md' : 'bg-elevated border border-border rounded-bl-md'}`}>{message.text}</div>)}
                      </div>
                      {mine && <div className="w-7 shrink-0 self-end"><Avatar name={last.displayName} photoURL={last.photoURL} size="xs" /></div>}
                    </div>
                  })}
                </div>
              </div>

              <div className="relative shrink-0 pt-2 pb-[env(safe-area-inset-bottom)]">
                {emojiOpen && <div className="absolute bottom-full left-0 right-0 mb-2 z-20 rounded-2xl border border-border bg-surface shadow-2xl p-3">
                  <div className="grid grid-cols-8 sm:grid-cols-10 gap-1 max-h-52 overflow-y-auto no-scrollbar">
                    {emojis.map((emoji, i) => <button key={`${emoji}-${i}`} type="button" aria-label={`Insert ${emoji}`} onPointerDown={(e) => e.preventDefault()} onClick={() => insertEmoji(emoji)} className="h-9 rounded-lg text-xl flex items-center justify-center hover:bg-elevated active:bg-elevated transition-colors">{emoji}</button>)}
                  </div>
                </div>}
                <form name="pace-group-message" onSubmit={handleSubmit} className="flex items-center gap-2 border-t border-border-soft pt-3">
                  <button type="button" aria-label="Emoji" aria-expanded={emojiOpen} onPointerDown={(e) => e.preventDefault()} onClick={() => setEmojiOpen((v) => !v)} className="shrink-0 w-11 h-11 rounded-full border border-border bg-surface text-lg flex items-center justify-center text-text-dim hover:text-text hover:bg-elevated active:scale-95 transition-transform">☺</button>
                  <input ref={inputRef} name="pace-group-message" value={text} onChange={(e) => setText(e.target.value)} autoComplete="off" autoCorrect="on" autoCapitalize="sentences" enterKeyHint="send" placeholder="Message..." className="min-w-0 flex-1 h-11 bg-surface border border-border rounded-full px-4 text-sm outline-none focus:border-text-faint" />
                  <button type="submit" aria-label="Send message" disabled={!text.trim()} onPointerDown={(e) => e.preventDefault()} className="shrink-0 w-11 h-11 rounded-full bg-accent text-bg flex items-center justify-center disabled:opacity-30 disabled:pointer-events-none active:scale-95 transition-transform"><SendIcon width="17" height="17" /></button>
                </form>
              </div>
            </div>
          }

          pattern = re.compile(r'\nfunction Chat\([^\n]*\) \{.*?(?=\nfunction [A-Z])', re.S)
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one Chat function boundary, found {len(matches)}')
          text = text[:matches[0].start()] + '\n' + new_chat + text[matches[0].end():]
          path.write_text(text)
          print('Patched Chat component')
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/GroupDetail.jsx .github/workflows/final-mobile-chat.yml
          git commit -m "polish mobile chat and add emoji picker" || exit 0
          git rm .github/workflows/final-mobile-chat.yml
          git commit -m "remove temporary chat patch workflow"
          git push
