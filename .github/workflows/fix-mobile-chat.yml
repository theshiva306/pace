name: Fix mobile chat layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch GroupDetail chat
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/GroupDetail.jsx')
          s = p.read_text()

          old_root = 'return <div className="min-h-svh px-5 pt-[calc(env(safe-area-inset-top)+20px)] pb-32 max-w-md mx-auto md:max-w-2xl md:pt-14 flex flex-col">'
          new_root = 'return <div className={`min-h-svh px-5 pt-[calc(env(safe-area-inset-top)+20px)] pb-32 max-w-md mx-auto md:max-w-2xl md:pt-14 flex flex-col ${tab === \'Chat\' ? \'pace-group-chat-page\' : \'\'}`}> '
          if old_root in s:
              s = s.replace(old_root, new_root, 1)

          start = s.find('function Chat({ groupId, messages, user, profile }) {')
          end = s.find('\nfunction computeMemberStats', start)
          if start == -1 or end == -1:
              raise SystemExit('Chat function boundaries not found')

          chat = r'''function Chat({ groupId, messages, user, profile }) {
  const [text, setText] = useState('')
  const [sending, setSending] = useState(false)
  const bottomRef = useRef(null)
  const inputRef = useRef(null)

  useEffect(() => {
    const vv = window.visualViewport
    if (!vv) return
    const syncViewport = () => {
      document.documentElement.style.setProperty('--pace-viewport-height', `${vv.height}px`)
    }
    syncViewport()
    vv.addEventListener('resize', syncViewport)
    vv.addEventListener('scroll', syncViewport)
    return () => {
      vv.removeEventListener('resize', syncViewport)
      vv.removeEventListener('scroll', syncViewport)
    }
  }, [])

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ block: 'end', behavior: 'smooth' })
  }, [messages.length])

  async function handleSend() {
    const trimmed = text.trim()
    if (!trimmed || sending) return
    setSending(true)
    try {
      await sendMessage({
        groupId,
        uid: user.uid,
        displayName: profile?.displayName || user.displayName,
        photoURL: profile?.photoURL || user.photoURL,
        text: trimmed,
      })
      setText('')
      requestAnimationFrame(() => {
        bottomRef.current?.scrollIntoView({ block: 'end', behavior: 'smooth' })
        inputRef.current?.focus()
      })
    } finally {
      setSending(false)
    }
  }

  return (
    <div className="pace-chat flex flex-col flex-1 min-h-0 -mx-1 animate-fade-in">
      <div className="pace-chat-messages flex-1 min-h-0 overflow-y-auto overscroll-contain no-scrollbar pr-1 pb-3 space-y-1">
        {messages.length === 0 && (
          <div className="flex h-full min-h-[220px] items-center justify-center text-sm text-text-faint">
            No messages yet
          </div>
        )}
        {messages.map((m, i) => {
          const mine = m.uid === user.uid
          const next = messages[i + 1]
          const previous = messages[i - 1]
          const isLastInRun = !next || next.uid !== m.uid
          const isFirstInRun = !previous || previous.uid !== m.uid
          return (
            <div key={m.id || `${m.uid}-${m.createdAt || i}`} className={`flex items-end gap-2 ${mine ? 'justify-end' : 'justify-start'} ${isFirstInRun ? 'mt-2' : ''}`}>
              {!mine && <div className="w-7 shrink-0">{isLastInRun && <Avatar name={m.displayName} photoURL={m.photoURL} size="sm" />}</div>}
              <div className={`max-w-[82%] sm:max-w-[72%] rounded-2xl px-3.5 py-2 text-sm leading-5 break-words ${mine ? 'bg-accent text-bg rounded-br-md' : 'bg-surface border border-border text-text rounded-bl-md'}`}>
                {m.text}
              </div>
              {mine && <div className="w-7 shrink-0">{isLastInRun && <Avatar name={m.displayName} photoURL={m.photoURL} size="sm" />}</div>}
            </div>
          )
        })}
        <div ref={bottomRef} className="h-px" />
      </div>

      <form
        onSubmit={(e) => { e.preventDefault(); handleSend() }}
        className="pace-chat-composer shrink-0 flex items-center gap-2 border-t border-border-soft bg-bg/95 pt-3 pb-[calc(env(safe-area-inset-bottom)+8px)] backdrop-blur-md"
      >
        <input
          ref={inputRef}
          value={text}
          onChange={(e) => setText(e.target.value.slice(0, 500))}
          placeholder="Message..."
          maxLength={500}
          name="pace-group-message"
          type="text"
          inputMode="text"
          enterKeyHint="send"
          autoComplete="off"
          autoCorrect="off"
          autoCapitalize="sentences"
          spellCheck={false}
          className="pace-chat-input min-w-0 flex-1 h-11 rounded-2xl bg-surface border border-border px-4 text-sm outline-none focus:border-text-faint placeholder:text-text-faint"
          disabled={sending}
        />
        <button
          type="submit"
          aria-label="Send message"
          disabled={!text.trim() || sending}
          className="shrink-0 w-11 h-11 rounded-2xl bg-accent text-bg flex items-center justify-center transition-all active:scale-95 disabled:opacity-35 disabled:cursor-not-allowed"
        >
          <SendIcon />
        </button>
      </form>
    </div>
  )
}
'''
          s = s[:start] + chat + s[end:]
          p.write_text(s)
          PY

      - name: Patch responsive chat CSS
        run: |
          cat >> src/index.css <<'CSS'

/* Chat owns the mobile viewport while it is open. This prevents the composer
   from floating into the middle of the page when Android's keyboard changes
   the visual viewport. */
.pace-group-chat-page {
  height: var(--pace-viewport-height, 100dvh);
  min-height: var(--pace-viewport-height, 100dvh);
  padding-bottom: 0 !important;
  overflow: hidden;
}

.pace-group-chat-page .pace-chat {
  min-height: 0;
}

.pace-group-chat-page .pace-chat-messages {
  min-height: 0;
  max-height: none;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.pace-group-chat-page .pace-chat-composer {
  position: relative;
  z-index: 5;
}

@media (max-width: 767px) {
  body:has(.pace-group-chat-page) nav.fixed.bottom-0 {
    display: none;
  }

  .pace-group-chat-page {
    max-width: none;
    width: 100%;
    padding-left: 16px;
    padding-right: 16px;
    padding-top: calc(env(safe-area-inset-top) + 12px);
  }

  .pace-group-chat-page .pace-chat-input {
    font-size: 16px;
  }

  .pace-group-chat-page .pace-chat-composer {
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
}
CSS

      - name: Commit changes if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/GroupDetail.jsx src/index.css
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'fix mobile chat keyboard layout [skip ci]'
          git push
