name: Fix mobile chat send behavior

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-chat-mobile.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat input behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/GroupDetail.jsx')
          s = p.read_text()

          old = '''requestAnimationFrame(() => inputRef.current?.focus())'''
          new = '''requestAnimationFrame(() => inputRef.current?.focus({ preventScroll: true }))'''
          if old not in s:
              raise SystemExit('focus pattern not found')
          s = s.replace(old, new, 1)

          old = '''<button\n          type="submit"\n          aria-label="Send message"'''
          new = '''<button\n          type="button"\n          onPointerDown={(e) => e.preventDefault()}\n          onClick={handleSend}\n          aria-label="Send message"'''
          if old not in s:
              raise SystemExit('send button pattern not found')
          s = s.replace(old, new, 1)

          old = '''return <div className="min-h-svh px-5 pt-[calc(env(safe-area-inset-top)+20px)] pb-32 max-w-md mx-auto md:max-w-2xl md:pt-14 flex flex-col">'''
          new = '''return <div className="min-h-svh px-5 pt-[calc(env(safe-area-inset-top)+20px)] pb-6 max-w-md mx-auto md:max-w-2xl md:pt-14 flex flex-col">'''
          if old not in s:
              raise SystemExit('group detail padding pattern not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/GroupDetail.jsx
          git commit -m 'Keep mobile chat keyboard open after sending' || exit 0
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-chat-mobile.yml
          git add .github/workflows/fix-chat-mobile.yml
          git commit -m 'Remove temporary chat fix workflow' || exit 0
          git push
