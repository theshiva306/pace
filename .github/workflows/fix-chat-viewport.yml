name: Fix mobile chat viewport

on:
  push:
    branches: [main]

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, '[chat-viewport-fix]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat viewport
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/pages/GroupDetail.jsx')
          s = p.read_text()

          old = 'return <div className="min-h-svh px-5 pt-[calc(env(safe-area-inset-top)+20px)] pb-6 max-w-md mx-auto md:max-w-2xl md:pt-14 flex flex-col">'
          new = 'return <div className={`px-5 pt-[calc(env(safe-area-inset-top)+20px)] pb-6 max-w-md mx-auto md:max-w-2xl md:pt-14 flex flex-col ${tab === \'Chat\' ? \'h-[var(--pace-viewport-height,100dvh)] min-h-0 overflow-hidden\' : \'min-h-svh\'}`}> '
          if old not in s:
              raise SystemExit('GroupDetail outer layout pattern not found')
          s = s.replace(old, new, 1)

          old_chat = '<div className="relative flex flex-col flex-1 min-h-0 -mx-1 animate-fade-in">'
          new_chat = '<div className="relative flex flex-col flex-1 min-h-0 h-full -mx-1 animate-fade-in">'
          if old_chat not in s:
              raise SystemExit('Chat container pattern not found')
          s = s.replace(old_chat, new_chat, 1)

          old_input = 'autoComplete="off"\n          autoCorrect="on"\n          autoCapitalize="sentences"\n          enterKeyHint="send"\n          spellCheck="true"'
          new_input = 'autoComplete="off"\n          autoCorrect="off"\n          autoCapitalize="sentences"\n          enterKeyHint="send"\n          spellCheck="false"\n          data-form-type="other"'
          if old_input not in s:
              raise SystemExit('Chat input attributes pattern not found')
          s = s.replace(old_input, new_input, 1)

          p.write_text(s)

          p = Path('src/components/GroupChat.jsx')
          s = p.read_text()
          # Keep the standalone chat component consistent with the page chat if it is used later.
          s = s.replace('autoCorrect="on" autoCapitalize="sentences" spellCheck', 'autoCorrect="off" autoCapitalize="sentences" spellCheck={false} data-form-type="other"')
          p.write_text(s)
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/GroupDetail.jsx src/components/GroupChat.jsx
          git rm .github/workflows/fix-chat-viewport.yml
          git commit -m '[chat-viewport-fix] keep composer above mobile keyboard'
          git push
