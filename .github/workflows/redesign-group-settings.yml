name: Redesign group settings

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redesign settings and icon
        shell: bash
        run: |
          python3 .github/scripts/redesign_group_settings.py

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/redesign-group-settings.yml .github/scripts/redesign_group_settings.py
          git add src/pages/GroupDetail.jsx src/components/icons.jsx .github/workflows/redesign-group-settings.yml .github/scripts/redesign_group_settings.py
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Redesign group settings UI [skip ci]"
          git push
