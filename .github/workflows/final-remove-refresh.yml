name: Remove remaining refresh controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove refresh UI wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/GroupDetail.jsx')
          s = p.read_text()
          replacements = [
            (', RefreshIcon', ''),
            (' onRefresh={weekly.refresh} refreshing={weekly.refreshing} updatedAt={weekly.updatedAt}', ''),
            (' onRefresh={daily.refresh} refreshing={daily.refreshing} updatedAt={daily.updatedAt}', ''),
            ('function RefreshRow({ label }) { return <div className="mb-4"><div className="text-[13px] tracking-[0.25em] text-text-faint">{label}</div></div> }', 'function RefreshRow({ label }) { return <div className="mb-4"><div className="text-[13px] tracking-[0.25em] text-text-faint">{label}</div></div> }'),
            ('function Leaderboard({ memberList, totals, currentUid, onRefresh, refreshing, updatedAt, week, onOpenWeekPicker, onSelectMember })', 'function Leaderboard({ memberList, totals, currentUid, week, onOpenWeekPicker, onSelectMember })'),
            ('function Live({ memberList, live, totals, currentUid, onRefresh, refreshing, updatedAt, onSelectMember })', 'function Live({ memberList, live, totals, currentUid, onSelectMember })'),
            ('<RefreshRow label="STANDINGS" onRefresh={onRefresh} refreshing={refreshing} updatedAt={updatedAt} />', '<RefreshRow label="STANDINGS" />'),
            ('<RefreshRow label="TODAY" onRefresh={onRefresh} refreshing={refreshing} updatedAt={updatedAt} />', '<RefreshRow label="TODAY" />'),
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/GroupDetail.jsx
          git commit -m "Remove remaining refresh controls" || true
          git push
