name: Fix leaderboard zero scores
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-leaderboard.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch leaderboard behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/GroupDetail.jsx')
          s = p.read_text()
          old = "const mine = leagueStatus(ranked, currentUid, { final: !week.isCurrent });"
          new = "const mine = (totals[currentUid] || 0) > 0 ? leagueStatus(ranked, currentUid, { final: !week.isCurrent }) : null;"
          if old not in s:
              raise SystemExit('Expected leaderboard mine expression not found')
          s = s.replace(old, new, 1)
          old = "{i < 3 ? <LeagueIcon width=\"18\" height=\"18\" className={RANK_COLOR[i]} /> : i + 1}"
          new = "{m.seconds === 0 ? '—' : i < 3 ? <LeagueIcon width=\"18\" height=\"18\" className={RANK_COLOR[i]} /> : i + 1}"
          if old not in s:
              raise SystemExit('Expected leaderboard rank expression not found')
          s = s.replace(old, new, 1)
          old = "league: idx < 3 ? LEAGUES[idx] : null"
          new = "league: m.seconds > 0 && idx < 3 ? LEAGUES[idx] : null, rank: m.seconds > 0 ? idx + 1 : null"
          if old not in s:
              raise SystemExit('Expected member stats league expression not found')
          s = s.replace(old, new, 1)
          old = "<span>Rank {stats.rank}</span>"
          new = "<span>{stats.rank ? `Rank ${stats.rank}` : '—'}</span>"
          if old not in s:
              raise SystemExit('Expected member detail rank text not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/GroupDetail.jsx
          git diff --cached --quiet || git commit -m 'Fix zero-score leaderboard ranks'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-leaderboard.yml
          git add .github/workflows/fix-leaderboard.yml
          git diff --cached --quiet || git commit -m 'Remove temporary leaderboard fix workflow'
          git push
